[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termin-watcher"
version = "0.1.0"
description = "Get alerted when an earlier appointment slot opens at a German Ausländerbehörde (TEVIS booking sites and similar)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]

[project.scripts]
termin-watcher = "termin_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
